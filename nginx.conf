load_module /usr/lib/nginx/modules/ngx_stream_module.so;

user  www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events { multi_accept on; worker_connections 16384; use epoll; }

# ══════════════════════════════════════════════════════════════════
# 🔀 STREAM — Railway TCP Proxy :8443
# ══════════════════════════════════════════════════════════════════
stream {
    log_format stream_basic '$remote_addr [$time_local] $protocol $status';
    access_log /var/log/nginx/stream_access.log stream_basic;
    error_log  /var/log/nginx/stream_error.log warn;

    upstream sshd_direct { server 127.0.0.1:22; }

    map $ssl_preread_protocol $ssh_backend {
        default     sshd_direct;
        "TLSv1.0"   127.0.0.1:2443;
        "TLSv1.1"   127.0.0.1:2443;
        "TLSv1.2"   127.0.0.1:2443;
        "TLSv1.3"   127.0.0.1:2443;
    }

    server {
        listen 8443;
        proxy_pass $ssh_backend;
        ssl_preread on;
        proxy_connect_timeout 10s;
        proxy_timeout        600s;
    }

    server {
        listen 2443 ssl;
        ssl_certificate       /etc/nginx/ssl/server.crt;
        ssl_certificate_key   /etc/nginx/ssl/server.key;
        ssl_protocols         TLSv1.2 TLSv1.3;
        ssl_ciphers           HIGH:!aNULL:!MD5:!RC4;
        ssl_session_cache     shared:SSL:10m;
        ssl_session_timeout   10m;
        ssl_handshake_timeout 15s;

        proxy_pass            sshd_direct;
        proxy_connect_timeout 10s;
        proxy_timeout         600s;
    }
}

# ══════════════════════════════════════════════════════════════════
# 🌐 HTTP — Cloudflare Tunnel :8080
# ══════════════════════════════════════════════════════════════════
http {
    gzip on; gzip_vary on; gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript;
    sendfile on; tcp_nopush on; tcp_nodelay on;
    keepalive_timeout 65; server_tokens off;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    client_max_body_size 32M;
    client_header_buffer_size 16k;
    large_client_header_buffers 4 16k;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # ── WS → Xray :8001 (VLESS/VMess/Trojan/SSH-WS) ──────
        location / {
            error_page 418 = @ws_tunnel;
            if ($http_upgrade ~* "websocket") {
                return 418;
            }
            # ── HTTP biasa → admin.go (HTML + API) ──
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
            proxy_read_timeout 600s;
        }

        location @ws_tunnel {
            proxy_pass http://127.0.0.1:8001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_buffering     off;
            proxy_request_buffering off;
        }
    }
}
